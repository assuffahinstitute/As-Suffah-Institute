function pwInput(id,extra){return `<div class="pwbox"><input id="${id}" type="password" ${extra||''}><button type="button" class="eye" onclick="eye(this)" aria-label="show / hide password">${EYE}</button></div>`}
function eye(b){const i=b.previousElementSibling,show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?EYEOFF:EYE}
async function ensureInit(force){if(force||!S.loaded){const x=await rpc('init');S=x;S.loaded=true}return S}
const REASONS=['অসুস্থ / Sick','ইন্টারনেট সমস্যা / Network issue','ব্যক্তিগত কাজ / Personal','ভ্রমণ / Travel','অন্যান্য / Other'];

function rpc(action,data){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>{
  if(String(e.message).includes('SESSION_EXPIRED')){toast(t('expired'),true);logout(true)}else toast(String(e.message).replace(/^Error:\s*/,''),true);rej(e)}).api(TOKEN,action,data||{})})}
function toast(m,bad){const el=$('toast');el.textContent=m;el.className=bad?'bad':'';el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3800)}
function apply(){document.body.classList.remove('bn','en');document.body.classList.add(lang);

function doLogin(){$('lbtn').disabled=true;$('lerr').textContent='';
  google.script.run.withSuccessHandler(async r=>{$('lbtn').disabled=false;
    if(!r.ok){$('lerr').textContent=({inactive:t('inactiveAcc'),pending:t('pendingAcc'),wrongtab_admin:t('wrongTabT'),wrongtab_teacher:t('wrongTabA')})[r.msg]||t('wrong');return}
    TOKEN=r.token;ME=r.me;$('pw').value='';$('login').style.display='none';$('app').style.display='block';
    S=r.boot.init;S.loaded=true;PRE=r.boot.first;$('un').textContent=ME.name;$('ur').textContent=ME.role+(ME.ro?' · '+t('readOnly'):'');$('who').textContent=ME.name;
    apply();go(ME.role==='Teacher'?'tdash':(allowed('dashboard')?'dashboard':PAGES.find(allowed)));if(r.defaultPw)toast(t('defPw'),true)})
  .withFailureHandler(e=>{$('lbtn').disabled=false;$('lerr').textContent=e.message}).login($('lu').value,$('pw').value,LMODE)}
$('lpw').innerHTML=pwInput('pw','autocomplete="current-password"');$('lbtn').onclick=doLogin;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

const TB={};
function mountTable(id,cfg){
  TB[id]={cfg,q:'',size:10,page:1,sk:null,sd:1,hide:{},open:{},f:{}};const T=TB[id];
  $(id).innerHTML=`<div class="tb-bar">
    <button class="x-copy" onclick="tbExp('${id}','copy')">${t('copy')}</button><button class="x-csv" onclick="tbExp('${id}','csv')">${t('csv')}</button>
    <button class="x-xls" onclick="tbExp('${id}','xls')">${t('excel')}</button><button class="x-pdf" onclick="tbExp('${id}','print')">${t('pdfx')}</button>
    <button class="x-prt" onclick="tbExp('${id}','print')">${t('printx')}</button>
    <details class="colmenu"><summary class="x-col">${t('columns')} ▾</summary><div class="pop">${cfg.cols.map((c,i)=>`<label><input type="checkbox" checked onchange="tbCol('${id}',${i},this.checked)">${c.l}</label>`).join('')}</div></details>
    ${(cfg.filters||[]).length?`<button class="x-prt" style="background:var(--teal2)" onclick="document.getElementById('${id}-f').classList.toggle('on')">${t('showFilters')}</button>`:''}</div>
    ${cfg.cols.some(c=>c.date)?`<p class="legend">${t('dateCodes')}</p>`:''}
    <div class="fpanel" id="${id}-f">${(cfg.filters||[]).map(k=>{const c=cfg.cols.find(c=>c.k===k);if(!c)return '';const vals=[...new Set(cfg.rows.flatMap(r=>cellText(c,r).split(',').map(s=>s.trim()).filter(Boolean)))].sort();
      return `<div><label>${c.l}</label><select onchange="TB['${id}'].f[${JSON.stringify(k).replace(/"/g,'&quot;')}]=this.value;TB['${id}'].page=1;tbDraw('${id}')"><option value="">${t('all')}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`}).join('')}</div>
    <div class="tb-top"><span>${t('showEntries')} <select onchange="TB['${id}'].size=+this.value;TB['${id}'].page=1;tbDraw('${id}')">${[10,25,50,100].map(n=>`<option>${n}</option>`).join('')}</select></span>
    <span>${t('search')}: <input oninput="clearTimeout(window._dq);const v=this.value;window._dq=setTimeout(()=>{TB['${id}'].q=v.toLowerCase();TB['${id}'].page=1;tbDraw('${id}')},150)"></span></div><div id="${id}-b"></div>`;
  tbDraw(id)}
let _ct;const cellText=(c,r)=>{const v=c.x?c.x(r):r[c.k];return v==null?'':String(v)};
function tbRows(id){const T=TB[id],cols=T.cfg.cols;let rows=T.cfg.rows.filter(r=>!T.q||cols.some(c=>cellText(c,r).toLowerCase().includes(T.q)));
  Object.keys(T.f).forEach(k=>{if(!T.f[k])return;const c=cols.find(c=>c.k===k);rows=rows.filter(r=>cellText(c,r).split(',').map(s=>s.trim()).includes(T.f[k]))});
  if(T.sk){const c=cols.find(c=>c.k===T.sk);rows=rows.slice().sort((a,b)=>{const x=c.x?c.x(a):a[c.k],y=c.x?c.x(b):b[c.k];
    return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'en',{numeric:true}))*T.sd})}
  return rows}
function tbDraw(id){const T=TB[id],cols=T.cfg.cols.filter(c=>!T.hide[c.k]),all=tbRows(id),n=all.length,pages=Math.max(1,Math.ceil(n/T.size));
  if(T.page>pages)T.page=pages;const from=(T.page-1)*T.size,rows=all.slice(from,from+T.size),span=cols.length+(T.cfg.actions?1:0)+(T.cfg.detail?1:0);
  const pb=[];for(let p=Math.max(1,T.page-2);p<=Math.min(pages,T.page+2);p++)pb.push(`<button class="${p===T.page?'on':''}" onclick="TB['${id}'].page=${p};tbDraw('${id}')">${p}</button>`);
  $(id+'-b').innerHTML=`<div class="scroll"><table><tr>${T.cfg.detail?'<th></th>':''}${cols.map(c=>`<th class="s" onclick="tbSort('${id}',${JSON.stringify(c.k).replace(/"/g,'&quot;')})">${c.l}${T.sk===c.k?(T.sd>0?' ▲':' ▼'):' ↕'}</th>`).join('')}${T.cfg.actions?`<th>${t('actions')}</th>`:''}</tr>
  ${rows.length?rows.map(r=>{const key=r[T.cfg.key];return `<tr>${T.cfg.detail?`<td><button class="ab x" onclick="tbOpen('${id}','${key}')">${T.open[key]?'−':'+'}</button></td>`:''}
   ${cols.map(c=>`<td>${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}${T.cfg.actions?`<td style="white-space:nowrap">${T.cfg.actions(r)}</td>`:''}</tr>
   ${T.open[key]?`<tr class="dt"><td colspan="${span}">${T.cfg.detail(r)}</td></tr>`:''}`}).join(''):`<tr><td colspan="${span}" class="legend" style="text-align:center">${t('noMatch')}</td></tr>`}</table></div>
  <div class="pg"><span class="legend">${t('showing')} ${n?from+1:0} ${t('to')} ${Math.min(n,from+T.size)} ${t('of')} ${n}</span>
  <span><button onclick="TB['${id}'].page=Math.max(1,TB['${id}'].page-1);tbDraw('${id}')">${t('prev')}</button> ${pb.join(' ')} <button onclick="TB['${id}'].page=Math.min(${pages},TB['${id}'].page+1);tbDraw('${id}')">${t('next')}</button></span></div>`}
function tbSort(id,k){const T=TB[id];if(T.sk===k)T.sd*=-1;else{T.sk=k;T.sd=1}tbDraw(id)}
function tbCol(id,i,on){TB[id].hide[TB[id].cfg.cols[i].k]=!on;tbDraw(id)}
function tbOpen(id,k){const T=TB[id];T.open[k]=!T.open[k];tbDraw(id)}
function tbExp(id,kind){const T=TB[id],cols=T.cfg.cols.filter(c=>!T.hide[c.k]),rows=tbRows(id);
  const data=[cols.map(c=>c.l)].concat(rows.map(r=>cols.map(c=>cellText(c,r))));
  if(kind==='copy'){const txt=data.map(r=>r.join('\t')).join('\n');const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(t('copied'))}catch(e){}ta.remove();return}
  if(kind==='csv'){dl('\ufeff'+data.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\r\n'),'export.csv','text/csv;charset=utf-8')}
  const h='<table border="1" cellpadding="6" style="border-collapse:collapse;font-family:serif">'+data.map((r,i)=>'<tr>'+r.map(v=>`<${i?'td':'th'}>${esc(v)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';
  if(kind==='xls')dl('\ufeff<html><head><meta charset="utf-8"></head><body>'+h+'</body></html>','export.xls','application/vnd.ms-excel');
  if(kind==='print'){openFrame('<html><head><meta charset="utf-8"><style>body{font-family:"Noto Serif Bengali",serif;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px;font-size:13px}th{background:#faf3e4}</style></head><body><h3>As-Suffah Institute — '+esc(t(page))+'</h3>'+h+'</body></html>',false,true)}}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const okc=c=>/^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:'#888';
const theme=v=>(S.themes||[]).find(x=>x.Word.toLowerCase()===String(v).toLowerCase());
function badge(v,label){const th=theme(v);return `<span class="chip" style="${th?`background:${okc(th.BgColor)};color:${okc(th.TextColor)}`:'background:#eef0f1;color:#44555a'}">${esc(label||v)}</span>`}
const chip=on=>badge(on?'Active':'Inactive',on?t('active'):t('inactive'));
function dateBadge(v){const d=dhakaDay(),s=v<d?'background:#f7e4e0;color:#a3301f':v===d?'background:#fbefd3;color:#8a5d00':'background:#dfeaf7;color:#1d4f91';return `<span class="chip" style="${s}">${esc(v)}</span>`}
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
function cellFor(c,v){v=v==null?'':String(v);if(!v)return '';
  if(c.Type==='file')return `<a class="btn sm alt" style="text-decoration:none" href="${esc(safeUrl(v))}" target="_blank">${t('openFile')}</a>`;
  if(c.Type==='url')return `<a href="${esc(safeUrl(v))}" target="_blank">${esc(v)}</a>`;
  if(c.Type==='select'||c.Type==='multiselect')return v.split(',').map(x=>badge(x.trim())).join(' ');
  if(c.Type==='date')return dateBadge(v);return esc(v)}
const cfList=e=>(S.fields||[]).filter(f=>f.Entity===e);
const customCols=e=>cfList(e).filter(c=>c.ShowInTable!=='No'&&c.Type!=='autoid'||c.Type==='autoid'&&c.ShowInTable!=='No').map(c=>({k:c.Label,l:c.Label,f:r=>cellFor(c,r[c.Label]),date:c.Type==='date'}));
const customFilters=e=>cfList(e).filter(c=>c.Filter==='Yes').map(c=>c.Label);
function cfDef(c){const o=(c.Options||'').split(',').map(x=>x.trim()).filter(Boolean);
  return {k:c.Label,l:c.Label,type:c.Type==='select'?'combo':c.Type,free:c.Type==='select',opts:c.Type==='select'?o.map(x=>[x,x]):o,ph:c.Placeholder,req:c.Required==='Yes',full:['textarea','multiselect','file'].includes(c.Type)}}

const btnE=(fn,a)=>`<button class="ab e" title="${t('edit')}" onclick="${fn}('${a}')">✎</button>`;
const btnD=(fn,a)=>`<button class="ab d" title="${t('del')}" onclick="${fn}('${a}')">✕</button>`;

function openFrame(html,showPdf,autoPrint){$('pdfBtn').style.display=showPdf?'':'none';const f=$('invFrame');f.srcdoc=html;$('modal').style.display='flex';

function printFrame(){const f=$('invFrame');f.contentWindow.focus();f.contentWindow.print()}
function fieldHtml(f,v,id){v=v==null?'':v;
  if(f.type==='password')return pwInput(id,f.ph?`placeholder="${esc(f.ph)}"`:'');
  if(f.type==='days')return `<div class="pgs" id="${id}">${[6,0,1,2,3,4,5].map(i=>`<label><input type="checkbox" value="${i}">${DAYS[lang][i]}</label>`).join('')}</div>`;
  if(f.type==='combo'){const lab=((f.opts.find(o=>String(o[0])===String(v))||[])[1])||(f.free?v:'');
    return `<input id="${id}" list="${id}_dl" value="${esc(lab)}" autocomplete="off" placeholder="${esc(f.ph||t('typeOrPick'))}"><datalist id="${id}_dl">${f.opts.filter(o=>o[0]!=='').map(o=>`<option value="${esc(o[1])}">`).join('')}</datalist>`}
  if(f.type==='select')return `<select id="${id}" ${f.dis?'disabled':''}>${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  if(f.type==='multiselect'){const cur=String(v).split(',').map(x=>x.trim());return `<div class="pgs" id="${id}">${f.opts.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${cur.includes(o)?'checked':''}>${esc(o)}</label>`).join('')||'—'}</div>`}
  if(f.type==='pages'){const cur=v==='*'||v===''?PERM:String(v).split(',');return `<div class="pgs" id="${id}">${PERM.map(p=>`<label><input type="checkbox" value="${p}" ${cur.includes(p)?'checked':''}>${t(p)}</label>`).join('')}</div>`}
  if(f.type==='textarea')return `<textarea id="${id}" rows="2" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${esc(v)}</textarea>`;
  if(f.type==='file')return `<div class="fbox" id="${id}" data-url="${esc(v)}"><input type="file" onchange="upFile(this)"><span class="fst">${v?`✓ <a href="${esc(safeUrl(v))}" target="_blank">${t('openFile')}</a> <button type="button" class="ab d" onclick="clrFile(this)">✕</button>`:''}</span></div>`;
  if(f.type==='autoid')return `<input id="${id}" value="${v||''}" placeholder="${t('autoNote')}" readonly>`;
  if(!f.type||f.type==='text')return `<textarea class="auto" rows="1" id="${id}" ${f.ro?'readonly':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${esc(v)}</textarea>`;
  const ty={phone:'tel'}[f.type]||f.type||'text';
  return `<input id="${id}" type="${ty}" value="${esc(v)}" ${f.ro?'readonly':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`}
function renderFields(fields,vals,pre){vals=vals||{};return '<div class="grid g2">'+fields.map((f,i)=>`<div style="${f.full||['pages','textarea','multiselect','file','days'].includes(f.type)?'grid-column:1/-1':''}"><label>${esc(f.l)}${f.req?' *':''}</label>${fieldHtml(f,vals[f.k],pre+i)}</div>`).join('')+'</div>'}
function collectFields(fields,pre){const o={};fields.forEach((f,i)=>{const id=pre+i;let v;
  if(f.type==='days'){v=[...$(id).querySelectorAll('input:checked')].map(x=>x.value).join(',')}
  else if(f.type==='pages'||f.type==='multiselect'){const c=[...$(id).querySelectorAll('input:checked')].map(x=>x.value);v=f.type==='pages'?(c.length===PERM.length?'*':c.join(',')):c.join(', ')}
  else if(f.type==='file')v=$(id).dataset.url||'';else if(f.type==='autoid')return;
  else if(f.type==='combo'){const raw=$(id).value.trim(),m=f.opts.find(o=>String(o[1]).toLowerCase()===raw.toLowerCase()||String(o[0]).toLowerCase()===raw.toLowerCase());
    if(raw&&!m&&!f.free){toast(t('pickFromList')+': '+f.l,true);throw 0}v=m?m[0]:raw}
  else if(!f.type||f.type==='text')v=$(id).value.trim().replace(/\s*[\r\n]+\s*/g,' ');else v=$(id).value.trim();
  if(f.req&&!v){toast(t('reqMsg')+': '+f.l,true);throw 0}o[f.k]=v});return o}
function upFile(inp){const box=inp.closest('.fbox'),st=box.querySelector('.fst'),file=inp.files[0];if(!file)return;
  if(file.size>5*1024*1024){toast('≤ 5 MB',true);inp.value='';return}
  st.textContent=t('uploading');const r=new FileReader();
  r.onload=async()=>{try{const o=await rpc('upload',{name:file.name,mime:file.type,b64:r.result.split(',')[1]});box.dataset.url=o.url;
    st.innerHTML=`✓ ${t('uploaded')} <a href="${esc(safeUrl(o.url))}" target="_blank">${t('openFile')}</a> <button type="button" class="ab d" onclick="clrFile(this)">✕</button>`}catch(e){st.textContent='';inp.value=''}};r.readAsDataURL(file)}
function clrFile(b){const box=b.closest('.fbox');box.dataset.url='';box.querySelector('.fst').textContent='';box.querySelector('input').value=''}

  mountTable('tbF',{key:'FieldID',rows:FLD,cols:[{k:'Entity',l:t('entity'),x:r=>t('ent_'+r.Entity)},{k:'Label',l:t('fieldName')},{k:'Type',l:t('fieldType'),x:r=>t('ty_'+r.Type)},{k:'Options',l:t('options')},
   {k:'Required',l:t('required'),x:r=>yn(r.Required)},{k:'ShowInTable',l:t('showInTable'),x:r=>yn(r.ShowInTable)},{k:'Filter',l:t('filterF'),x:r=>yn(r.Filter)},{k:'Chart',l:t('chart'),x:r=>r.Chart==='Bar'?t('bar'):r.Chart==='Pie'?t('pie'):t('none')}],
   actions:r=>btnE('fieldForm',r.FieldID)+btnD('delField',r.FieldID)})}
function fieldForm(id){const r=id?FLD.find(x=>x.FieldID===id):{Entity:'Students',Type:'text',Required:'No',ShowInTable:'Yes',Filter:'No',Chart:'None'};
  const ynO=[['No',t('no')],['Yes',t('yes')]];
  formModal(id?t('edit')+' — '+r.Label:t('addField'),[{k:'Entity',l:t('entity'),type:'select',dis:!!id,opts:['Students','Teachers','Expenses'].map(e=>[e,t('ent_'+e)])},{k:'Label',l:t('fieldName'),req:true},
   {k:'Type',l:t('fieldType'),type:'select',opts:['text','email','phone','number','date','textarea','select','multiselect','url','file','autoid'].map(x=>[x,t('ty_'+x)])},{k:'Placeholder',l:t('placeholder')},
   {k:'Options',l:t('options'),full:true},{k:'Required',l:t('required'),type:'select',opts:ynO},{k:'ShowInTable',l:t('showInTable'),type:'select',opts:[['Yes',t('yes')],['No',t('no')]]},
   {k:'Filter',l:t('filterF'),type:'select',opts:ynO},{k:'Chart',l:t('chart'),type:'select',opts:[['None',t('none')],['Bar',t('bar')],['Pie',t('pie')]]}],r,
   async v=>{if(id){delete v.Entity;await rpc('updField',{FieldID:id,patch:v})}else await rpc('addField',v);toast(t('saved'));fieldsPage()})}
async function delField(id){if(!confirmDel())return;await rpc('delField',{FieldID:id});toast(t('deleted'));fieldsPage()}

/* ---------- theme page ---------- */
let THM=[];
async function themePage(){await ensureInit(true);THM=S.themes;
  $('view').innerHTML=`<div class="row" style="margin-bottom:8px"><button class="btn" onclick="themeForm()">＋ ${t('addTheme')}</button></div><p class="legend">${t('themeNote')}</p><div id="tbH2"></div>`;
  mountTable('tbH2',{key:'ThemeID',rows:THM,cols:[{k:'Word',l:t('word')},{k:'pv',l:t('preview'),x:r=>r.Word,f:r=>badge(r.Word)},{k:'BgColor',l:t('bgColor'),f:r=>`<span style="color:${okc(r.BgColor)}">■</span> ${esc(r.BgColor)}`},
   {k:'TextColor',l:t('textColor'),f:r=>`<span style="color:${okc(r.TextColor)}">■</span> ${esc(r.TextColor)}`},{k:'Description',l:t('desc')}],actions:r=>btnE('themeForm',r.ThemeID)+btnD('delTheme',r.ThemeID)})}
function themeForm(id){const r=id?THM.find(x=>x.ThemeID===id):{BgColor:'#e3f3ea',TextColor:'#1f6b49'};
  formModal(id?t('edit'):t('addTheme'),[{k:'Word',l:t('word'),req:true},{k:'BgColor',l:t('bgColor'),type:'color'},{k:'TextColor',l:t('textColor'),type:'color'},{k:'Description',l:t('desc'),full:true}],r,
   async v=>{if(id)await rpc('updTheme',{ThemeID:id,patch:v});else await rpc('addTheme',v);toast(t('saved'));themePage()})}
async function delTheme(id){if(!confirmDel())return;await rpc('delTheme',{ThemeID:id});toast(t('deleted'));themePage()}

/* ---------- teacher dashboard ---------- */
let TD=null;
async function tdash(){TD=PRE||await rpc('tdash');PRE=null;tdDraw()}
const stLbl=v=>v==='Present'?t('present'):v==='Absent'?t('absent'):'—';
const stBadge=v=>v?badge(v,stLbl(v)):'—';
function seg(id,k,val,locked){return `<div class="seg"><button type="button" class="p ${val==='Present'?'on':''}" ${locked?'disabled':''} onclick="setSt('${id}','${k}','Present')">✓ ${t('present')}</button><button type="button" class="a ${val==='Absent'?'on':''}" ${locked?'disabled':''} onclick="setSt('${id}','${k}','Absent')">✕ ${t('absent')}</button></div>`}
function reasonBox(id,k,c){const key=k==='T'?'TeacherReason':'StudentReason',st=k==='T'?c.TeacherStatus:c.StudentStatus;if(st!=='Absent')return '';
  return `<div class="rb">${REASONS.map(r=>`<button type="button" class="rc" ${c.open?'':'disabled'} data-r="${esc(r)}" onclick="setReason('${id}','${k}',this.dataset.r,true)">${esc(r)}</button>`).join('')}<input ${c.open?'':'disabled'} value="${esc(c[key])}" placeholder="${t('reasonPh')}" oninput="setReason('${id}','${k}',this.value)"></div>`}
function classCard(c){const id=c.ClassID,lock=!c.open;
  return `<div class="cls" id="c_${id}"><div class="clh"><b>${esc(c.Time)}</b> &nbsp; ${esc(c.Name)} <span class="code">${esc(c.StudentID)}</span> ${c.MarkedAt?`<span class="legend">✓ ${esc(c.MarkedAt)}</span>`:''}</div>
  ${lock?`<p class="legend">⏳ ${t('notYet')} (${esc(c.Time)})</p>`:''}
  <div class="crow"><span>${t('classLbl')}</span>${c.EndedAt?`<b>${c.Minutes} ${t('min')}</b>`:c.StartedAt?`<button class="btn sm" style="background:var(--bad)" ${lock?'disabled':''} onclick="clsEnd('${id}')">■ ${t('endClass')}</button> <span class="legend">${t('startedAt')} ${esc(String(c.StartedAt).slice(11,16))}</span>`:`<button class="btn sm" ${lock?'disabled':''} onclick="clsStart('${id}')">▶ ${t('startClass')}</button>`}${c.MeetLink?` <a class="btn sm alt" href="${esc(safeUrl(c.MeetLink))}" target="_blank" rel="noopener noreferrer">${t('openLink')}</a>`:''}</div>
  <div class="crow"><span>${t('teacher')}</span>${seg(id,'T',c.TeacherStatus,lock)}</div>${reasonBox(id,'T',c)}
  <div class="crow"><span>${t('student')}</span>${seg(id,'S',c.StudentStatus,lock)}</div>${reasonBox(id,'S',c)}
  <button class="btn sm" ${lock?'disabled':''} onclick="saveAtt('${id}')">${t('save')}</button></div>`}
const tdCls=id=>TD.today.find(x=>x.ClassID===id);
function redrawCard(id){const c=tdCls(id);$('c_'+id).outerHTML=classCard(c)}
function setSt(id,k,v){const c=tdCls(id);c[k==='T'?'TeacherStatus':'StudentStatus']=v;redrawCard(id)}
function setReason(id,k,v,redraw){const c=tdCls(id);c[k==='T'?'TeacherReason':'StudentReason']=v;if(redraw)redrawCard(id)}
async function saveAtt(id){const c=tdCls(id);
  if(!c.TeacherStatus){toast(t('selTeacher'),true);return}if(c.TeacherStatus==='Present'&&!c.StudentStatus){toast(t('selStudent'),true);return}
  const r=await rpc('attSave',{ClassID:id,TeacherStatus:c.TeacherStatus,TeacherReason:c.TeacherReason,StudentStatus:c.StudentStatus,StudentReason:c.StudentReason});
  c.MarkedAt=r.MarkedAt;redrawCard(id);toast(t('saved'))}
async function clsStart(id){const c=tdCls(id),r=await rpc('clsStart',{ClassID:id});c.StartedAt=r.StartedAt;redrawCard(id);toast(t('saved'))}
async function clsEnd(id){if(!confirm(t('confirmEnd')))return;const c=tdCls(id),r=await rpc('clsEnd',{ClassID:id});c.EndedAt=r.EndedAt;c.Minutes=r.Minutes;redrawCard(id);toast(t('saved'))}
function tdDraw(){const d=TD;
  $('view').innerHTML=`<div class="grid g4"><div class="stat"><small>${t('totalStu')}</small><b>${d.counts.total}</b></div><div class="stat pos"><small>${t('activeStu')}</small><b>${d.counts.active}</b></div>
  <div class="stat neg"><small>${t('inactiveStu')}</small><b>${d.counts.inactive}</b></div><div class="stat"><small>${t('todayCount')}</small><b>${d.today.length}</b></div></div>
  <h3>${t('todayClasses')} — ${esc(d.now.date)}</h3><p class="legend" style="margin-top:-6px">${t('closeNote')}</p>
  ${d.today.length?d.today.map(classCard).join(''):`<div class="empty">${t('noClasses')}</div>`}
  <h3>${t('upcoming')}</h3><div id="tbUp"></div><h3>${t('myStudents')}</h3><div id="tbMy"></div><h3>${t('pastClasses')}</h3><div id="tbPast"></div>`;
  mountTable('tbUp',{key:'ClassID',rows:d.upcoming,cols:[{k:'Date',l:t('date')},{k:'Time',l:t('time')},{k:'Name',l:t('student')},{k:'StudentID',l:t('code'),f:r=>`<span class="code">${esc(r.StudentID)}</span>`}]});
  mountTable('tbMy',{key:'ID',rows:d.students,cols:[{k:'ID',l:t('code'),f:r=>`<span class="code">${esc(r.ID)}</span>`},{k:'Name',l:t('name')},{k:'next',l:t('nextClass'),x:r=>r.next?r.next.Date+'  '+r.next.Time:'—'}]});
  mountTable('tbPast',{key:'ClassID',rows:d.past,cols:[{k:'Date',l:t('date')},{k:'Time',l:t('time')},{k:'Name',l:t('student')},{k:'Minutes',l:t('min')},{k:'TeacherStatus',l:t('teacher'),x:r=>stLbl(r.TeacherStatus),f:r=>stBadge(r.TeacherStatus)},{k:'TeacherReason',l:t('reason')+' ('+t('teacher')+')'},
   {k:'StudentStatus',l:t('student'),x:r=>stLbl(r.StudentStatus),f:r=>stBadge(r.StudentStatus)},{k:'StudentReason',l:t('reason')+' ('+t('student')+')'}]})}

/* ---------- attendance (admin / staff) ---------- */
let CLS=[];
async function attendance(){await ensureInit();const [list,stu,hrs]=await Promise.all([rpc('classes'),rpc('students'),rpc('classHours')]);CLS=list;STU=stu;
  const sn=id=>(STU.find(s=>s.ID===id)||{}).Name||id,today=dhakaDay(),td=CLS.filter(c=>c.Date===today);
  $('view').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="scheduleForm()">＋ ${t('scheduleBtn')}</button></div>
  <div class="grid g4" style="margin-bottom:14px"><div class="stat"><small>${t('todayCount')}</small><b>${td.length}</b></div><div class="stat pos"><small>${t('sPresent')}</small><b>${td.filter(c=>c.StudentStatus==='Present').length}</b></div>
  <div class="stat neg"><small>${t('sAbsent')}</small><b>${td.filter(c=>c.StudentStatus==='Absent').length}</b></div><div class="stat neg"><small>${t('tAbsent')}</small><b>${td.filter(c=>c.TeacherStatus==='Absent').length}</b></div></div><div id="tbA"></div><h3>${t('hoursH')}</h3><div id="tbHr"></div>`;
  mountTable('tbA',{key:'ClassID',rows:CLS,filters:['Date','tc','StudentStatus','TeacherStatus'],cols:[{k:'Date',l:t('date')},{k:'Time',l:t('time')},{k:'st',l:t('student'),x:r=>sn(r.StudentID)+' ('+r.StudentID+')'},{k:'tc',l:t('teacher'),x:r=>tName(r.TeacherID)},
   {k:'StudentStatus',l:t('student')+' ✓',x:r=>stLbl(r.StudentStatus),f:r=>stBadge(r.StudentStatus)},{k:'StudentReason',l:t('reason')+' ('+t('student')+')'},
   {k:'TeacherStatus',l:t('teacher')+' ✓',x:r=>stLbl(r.TeacherStatus),f:r=>stBadge(r.TeacherStatus)},{k:'TeacherReason',l:t('reason')+' ('+t('teacher')+')'},{k:'MarkedAt',l:t('markedAt')}],
   actions:r=>btnE('editClass',r.ClassID)+btnD('delClass',r.ClassID)});
  mountTable('tbHr',{key:'K',filters:['Month'],rows:hrs.map(r=>Object.assign({K:r.Month+'|'+r.Teacher},r)),cols:[{k:'Month',l:t('month')},{k:'Teacher',l:t('teacher')},{k:'Scheduled',l:t('scheduled')},{k:'Held',l:t('held')},{k:'Minutes',l:t('min')},{k:'hr',l:t('hours'),x:r=>(r.Minutes/60).toFixed(1)},{k:'TeacherAbsent',l:t('tAbsent')}]})}
function scheduleForm(){formModal(t('scheduleBtn'),[{k:'StudentID',l:t('student'),type:'combo',req:true,full:true,opts:STU.filter(s=>s.Status==='Active').map(s=>[s.ID,s.Name+' ('+s.ID+')'])},
  {k:'Date',l:t('startDate'),type:'date',req:true},{k:'Time',l:t('time'),type:'time',req:true},{k:'Days',l:t('repeatDays'),type:'days'},{k:'Weeks',l:t('weeks'),type:'number'}],{Weeks:4},
  async v=>{const r=await rpc('addClasses',v);toast(t('addedCls')+r.added);attendance()})}
function editClass(id){const r=CLS.find(c=>c.ClassID===id),so=[['',t('select')],['Present',t('present')],['Absent',t('absent')]];
  formModal(t('edit')+' — '+id,[{k:'Date',l:t('date'),type:'date'},{k:'Time',l:t('time'),type:'time'},{k:'TeacherStatus',l:t('teacher'),type:'select',opts:so},{k:'TeacherReason',l:t('reason')+' ('+t('teacher')+')'},
   {k:'StudentStatus',l:t('student'),type:'select',opts:so},{k:'StudentReason',l:t('reason')+' ('+t('student')+')'},{k:'Minutes',l:t('min'),type:'number'}],r,async v=>{await rpc('updClass',{ClassID:id,patch:v});toast(t('saved'));attendance()})}
async function delClass(id){if(!confirmDel())return;await rpc('delClass',{ClassID:id});toast(t('deleted'));attendance()}

/* ---------- website content: banners, board, reviews ---------- */
let CMSD={},csub='banners';
const imgUrl=u=>{const m=/\/d\/([\w-]+)/.exec(u||'');return m?'https://lh3.googleusercontent.com/d/'+m[1]:(u||'')};
const thumb=u=>u?`<img src="${esc(safeUrl(imgUrl(u)))}" alt="" style="height:44px;max-width:120px;width:auto;border-radius:4px;object-fit:cover">`:'—';
const ynO=()=>[['Yes',t('yes')],['No',t('no')]];
const stR=v=>v==='Approved'?t('approvedS'):v==='Hidden'?t('hiddenS'):t('pending');
const CM={
 banners:{sheet:'Banners',id:'BannerID',list:'Banners',def:{Order:1,Show:'Yes'},
  cols:()=>[{k:'Image',l:t('image'),x:r=>r.Image,f:r=>thumb(r.Image)},{k:'Title',l:t('title')},{k:'Link',l:t('linkL')},{k:'Order',l:t('order')},{k:'Show',l:t('show'),x:r=>yn(r.Show)}],
  fields:()=>[{k:'Image',l:t('image')+' (1920×1080)',type:'file',req:true,full:true},{k:'Title',l:t('title'),full:true},{k:'Link',l:t('linkL'),type:'url',full:true,ph:'https://…'},{k:'Order',l:t('order'),type:'number'},{k:'Show',l:t('show'),type:'select',opts:ynO()}]},
 board:{sheet:'Board',id:'MemberID',list:'Board',def:{Order:1,Show:'Yes'},
  cols:()=>[{k:'Photo',l:t('photo'),x:r=>r.Photo,f:r=>thumb(r.Photo)},{k:'Name',l:t('name')},{k:'Role',l:t('roleL')},{k:'Order',l:t('order')},{k:'Show',l:t('show'),x:r=>yn(r.Show)}],
  fields:()=>[{k:'Name',l:t('name'),req:true},{k:'Role',l:t('roleL')},{k:'Photo',l:t('photo'),type:'file',full:true},{k:'Order',l:t('order'),type:'number'},{k:'Show',l:t('show'),type:'select',opts:ynO()}]},
 reviews:{sheet:'Reviews',id:'ReviewID',list:'Reviews',def:{Rating:5,Status:'Approved'},
  cols:()=>[{k:'Date',l:t('date')},{k:'Name',l:t('name')},{k:'Country',l:t('country')},{k:'Rating',l:t('rating'),x:r=>'★'.repeat(r.Rating||0)},{k:'Text',l:t('reviewText')},{k:'Status',l:t('status'),x:r=>stR(r.Status),f:r=>badge(r.Status,stR(r.Status))}],
  fields:()=>[{k:'Name',l:t('name'),req:true},{k:'Country',l:t('country')},{k:'Rating',l:t('rating'),type:'select',opts:[5,4,3,2,1].map(n=>[n,'★'.repeat(n)])},{k:'Status',l:t('status'),type:'select',opts:[['Approved',t('approvedS')],['Pending',t('pending')],['Hidden',t('hiddenS')]]},{k:'Text',l:t('reviewText'),type:'textarea',req:true,full:true}]}};
async function content(){CMSD=await rpc('cmsList');const m=CM[csub];
  $('view').innerHTML=`<div class="tabs">${Object.keys(CM).map(k=>`<button class="${k===csub?'on':''}" onclick="csub='${k}';content()">${t('c_'+k)}</button>`).join('')}</div><p class="legend">${t('cmsNote')}</p><div class="row" style="margin-bottom:10px"><button class="btn" onclick="cmsForm()">＋ ${t('addNew')}</button></div><div id="tbC"></div>`;
  mountTable('tbC',{key:m.id,rows:CMSD[m.list],cols:m.cols(),actions:r=>(csub==='reviews'&&r.Status!=='Approved'?`<button class="ab v" title="${t('approve')}" onclick="cmsOk('${r[m.id]}')">✓</button>`:'')+`<button class="ab e" title="${t('edit')}" onclick="cmsForm('${r[m.id]}')">✎</button><button class="ab d" title="${t('del')}" onclick="cmsDel('${r[m.id]}')">✕</button>`})}
function cmsForm(id){const m=CM[csub],r=id?CMSD[m.list].find(x=>x[m.id]===id):m.def;
  formModal(id?t('edit'):t('addNew'),m.fields(),r,async v=>{['Image','Photo'].forEach(k=>{if(v[k])v[k]=imgUrl(v[k])});
    if(id)await rpc('cmsUpd',{sheet:m.sheet,id,patch:v});else await rpc('cmsAdd',{sheet:m.sheet,row:v});toast(t('saved'));content()})}
async function cmsOk(id){const m=CM[csub];await rpc('cmsUpd',{sheet:m.sheet,id,patch:{Status:'Approved'}});toast(t('saved'));content()}
async function cmsDel(id){if(!confirmDel())return;const m=CM[csub];await rpc('cmsDel',{sheet:m.sheet,id});toast(t('deleted'));content()}

function autoGrow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function sweep(){requestAnimationFrame(()=>document.querySelectorAll('textarea.auto').forEach(autoGrow))}
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('auto'))autoGrow(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('auto'))e.preventDefault()});
apply();
if(START==='register')setTimeout(regTeacher,400);
</script>
</body></html>
