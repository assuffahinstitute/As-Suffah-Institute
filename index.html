<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F7F3EA;--card:#FFFDF8;--ink:#0B2D36;--mut:#566a6e;--line:#E4D9C4;--gold:#D9902A;--goldt:#9a5f10;--teal:#0B2D36;--teal2:#12454B;--chip:#FBEFD3}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B20;--card:#10303A;--ink:#EDE6D6;--mut:#a9bcbe;--line:#1d4a55;--goldt:#E8B05A;--teal:#06161a;--teal2:#0d3a43;--chip:#3a2f12}}
:root[data-theme="dark"]{--bg:#0A1B20;--card:#10303A;--ink:#EDE6D6;--mut:#a9bcbe;--line:#1d4a55;--goldt:#E8B05A;--teal:#06161a;--teal2:#0d3a43;--chip:#3a2f12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4","Noto Serif Bengali",Georgia,serif;line-height:1.7}
body.bn{font-family:"Noto Serif Bengali","Source Serif 4",Georgia,serif;line-height:1.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--teal);z-index:60}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--teal);border-bottom:3px solid var(--gold)}
header .w{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:700;text-decoration:none;margin-right:auto}.brand img{height:46px;width:auto}
nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:#E9E2D0;text-decoration:none;font-size:15px}nav a:hover{color:var(--gold)}
.bt{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn{display:inline-block;background:var(--gold);color:#0B2D36;font-weight:700;border:0;border-radius:6px;padding:11px 22px;text-decoration:none;cursor:pointer;font-size:16px}
.btn.o{background:transparent;border:2px solid var(--teal2);color:var(--ink);padding:9px 18px}
.slider{position:relative;overflow:hidden;background:var(--teal);max-width:1200px;width:calc(100% - 24px);margin:14px auto 0;border-radius:14px}
.sl{display:none;min-height:430px;align-items:center;background:linear-gradient(135deg,#0B2D36,#1b5b5f);color:#fff;background-size:cover;background-position:center}.sl.on{display:flex}
.sl .w{padding:50px 76px;width:100%}.sl.poster{background-size:cover;background-position:center;background-color:#06161a;aspect-ratio:16/9;min-height:0}.sl h1{margin:0 0 12px;font-size:clamp(30px,5vw,52px);line-height:1.25;color:var(--gold);max-width:700px}.sl p{margin:0 0 24px;font-size:20px;color:#E9E2D0;max-width:600px}
.arr{position:absolute;top:50%;transform:translateY(-50%);background:#0008;color:#fff;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:20px}.dots{position:absolute;bottom:14px;left:0;right:0;text-align:center}
.dots button{width:11px;height:11px;border-radius:50%;border:0;margin:0 4px;background:#ffffff66;cursor:pointer}.dots button.on{background:var(--gold)}
section{padding:60px 0}h2{margin:0 0 12px;font-size:clamp(26px,4vw,34px)}.sub{color:var(--mut);margin:0 0 26px;font-size:18px}
.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.alt .c{background:var(--bg)}.c h3{margin:0;font-size:20px}.c small{color:var(--mut)}
.chip{display:inline-block;background:var(--chip);color:var(--goldt);border-radius:12px;padding:1px 10px;font-size:13px}
.pl{border:1.5px solid var(--gold);border-radius:6px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.c ul{margin:0;padding-left:18px;font-size:15px;flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap}
form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}label{font-size:14px;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.steps{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 26px;padding:0;list-style:none;counter-reset:s}.steps li{flex:1;min-width:210px;counter-increment:s}.steps li::before{content:counter(s);display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#0B2D36;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
.av{width:72px;height:72px;border-radius:50%;background:var(--teal2);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto}
.t{text-align:center;align-items:center}
details{border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:10px;padding:12px 16px}summary{cursor:pointer;font-weight:600}
footer{background:var(--teal);color:#E9E2D0;padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));font-size:15px}footer a{color:var(--gold);cursor:pointer}
.fl{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:10px}.fl a{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 10px #0005}.fl svg{width:26px;height:26px}
.tag{font-size:20px;margin:0 0 22px}.btn.big{padding:16px 34px;font-size:19px}.btn.dk{background:var(--teal2);color:#fff}.btn.gr{background:#22b455;color:#fff;display:inline-flex;gap:8px;align-items:center}.btn.gr svg{width:24px;height:24px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px;font-size:15px}.pill::before{content:'●';color:var(--gold);margin-right:8px;font-size:10px}.stat{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px 20px}.stat b{display:block;font-size:34px;color:var(--goldt);line-height:1.2}.intro{padding:40px 0 20px}.intro .row{margin-bottom:22px}
dialog{max-width:640px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:24px}dialog::backdrop{background:#000a}
.sc{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.sc:hover{border-color:var(--gold)}.sc i{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;flex:none}.sc i svg{width:26px;height:26px}.sc b{display:block}.sc span{color:var(--goldt);font-size:14px}
[hidden]{display:none!important}header .w{position:relative}#mp{position:absolute;right:20px;top:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:250px;padding:10px;box-shadow:0 8px 24px #0006;display:flex;flex-direction:column;z-index:70}#mp a{text-decoration:none;padding:9px 12px;border-radius:6px}#mp a:hover{background:var(--chip)}#mp b{padding:6px 12px 2px;color:var(--goldt);font-size:14px}#mp hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
@media(max-width:900px){header nav{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap;gap:22px;white-space:nowrap;padding:2px 0 4px}}
#pf{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}.pfb{background:var(--teal);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);gap:10px;flex-wrap:wrap}.pfb a{color:var(--gold);margin-right:12px;font-size:14px}#pf iframe{flex:1;border:0;width:100%;background:#fff}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
